services:
  # Backend Web Service (Django)
  - type: web
    name: expense-tracker-backend
    env: python
    buildCommand: "./render_build.sh"
    startCommand: "gunicorn config.wsgi:application"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: expense-tracker-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*" # Update with your Render URL later
      - key: CORS_ALLOWED_ORIGINS
        value: "https://expense-tracker-frontend.onrender.com" # Update with your frontend URL
      - key: PYTHON_VERSION
        value: "3.10.12" # Specify your python version

  # Celery Worker
  - type: worker
    name: expense-tracker-worker
    env: python
    buildCommand: "./render_build.sh"
    startCommand: "celery -A config worker --loglevel=info"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: expense-tracker-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.10.12"

  # Frontend Static Site (React)
  - type: web
    name: expense-tracker-frontend
    env: static
    buildCommand: "npm install && npm run build"
    publishDir: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: "https://expense-tracker-backend.onrender.com"

  # Redis Instance
  - type: redis
    name: expense-tracker-redis
    plan: free
    ipAllowList: [] # Only allow internal connections

# Postgres Database
databases:
  - name: expense-tracker-db
    plan: free
