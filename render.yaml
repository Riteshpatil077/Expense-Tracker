services:
  # Backend Web Service (Django)
  - type: web
    name: expense-tracker-backend
    env: python
    rootDir: backend
    buildCommand: "./render_build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: expense-tracker-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: DEBUG
        value: "False"

  # Celery Worker
  - type: worker
    name: expense-tracker-worker
    env: python
    rootDir: backend
    buildCommand: "./render_build.sh"
    startCommand: "celery -A config worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: expense-tracker-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: DEBUG
        value: "False"

  # Frontend Static Site
  - type: web
    name: expense-tracker-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist

  # Managed Redis (must be inside services block)
  - type: redis
    name: expense-tracker-redis
    plan: free
    ipAllowList: []

# Postgres Database
databases:
  - name: expense-tracker-db
    plan: free
